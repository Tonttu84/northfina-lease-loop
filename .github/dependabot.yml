# Dependabot is the only alert path for dependencies: .npmrc has audit=false, so `npm ci` never
# warns. One grouped npm PR a week, and one for the GitHub Actions the workflow pins.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      npm:
        patterns:
          - '*'
    ignore:
      # A TypeScript major waits for typescript-eslint: its peer range (8.72: >=4.8.4 <6.1.0)
      # made the TypeScript 7 bump fail `npm ci` (PRs 7 and 8). Lift this when it accepts the new major.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # @types/node follows the Node major in .nvmrc, which CI and the engines field use, not the newest Node.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: chore(deps)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore(ci)
