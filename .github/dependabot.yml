# Dependabot keeps the dependencies current: one grouped npm PR a week, and one grouped PR for the
# GitHub Actions, which the workflow pins by commit SHA with the release tag in a trailing comment
# (`@<sha> # v7.0.1`); Dependabot moves both. It is not the only alert path: `npm ci` reports
# known advisories, and CI fails on a high or critical one (`npm audit --audit-level=high`, D96).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      npm:
        patterns:
          - '*'
    ignore:
      # A TypeScript major waits for typescript-eslint: its peer range (8.72: >=4.8.4 <6.1.0)
      # made the TypeScript 7 bump fail `npm ci` (PRs 7 and 8). Lift this when it accepts the new major.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # @types/node follows the Node major in .nvmrc, which CI runs on (engines.node is only the floor), not the newest Node.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: chore(deps)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns:
          - '*'
    commit-message:
      prefix: chore(ci)
