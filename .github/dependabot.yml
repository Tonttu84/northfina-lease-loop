# Dependabot version updates: one grouped pull request per ecosystem, roughly every two weeks, from
# the owner's shared template (Tonttu84/ai-workflow, templates/dependabot.yml; D104).
#
# Dependabot has no two-week interval, so the schedule is a cron job on the 1st and the 15th of
# each month (times in UTC). The commit-message prefixes (`chore`, and `ci` for actions) make every
# title a valid subject for the commit hook and the CI commit check; the hook lets Dependabot's
# long "bump ..." subjects, and only those, past the 72-character limit.
#
# The workflows pin actions by commit SHA with the release tag in a trailing comment
# (`@<sha> # v7.0.1`), and only Dependabot moves them. It is not the only alert path: `npm ci`
# reports known advisories, and CI fails on a high or critical one (`npm audit --audit-level=high`,
# D96). Security updates are a separate repository setting, on; each ecosystem has a short-named
# group for them, since groups apply to version updates unless they say otherwise.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: cron
      cronjob: '0 6 1,15 * *'
    groups:
      actions:
        applies-to: version-updates
        patterns:
          - '*'
      gha-sec:
        applies-to: security-updates
        patterns:
          - '*'
    commit-message:
      prefix: ci

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: cron
      cronjob: '0 6 1,15 * *'
    groups:
      npm:
        applies-to: version-updates
        patterns:
          - '*'
      npm-sec:
        applies-to: security-updates
        patterns:
          - '*'
    ignore:
      # A TypeScript major waits for typescript-eslint: its peer range (8.72: >=4.8.4 <6.1.0)
      # made the TypeScript 7 bump fail `npm ci` (PRs 7 and 8). Lift this when it accepts the new major.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # @types/node follows the Node major in .nvmrc, which CI runs on (engines.node is only the floor), not the newest Node.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: chore
