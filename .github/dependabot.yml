# Dependabot is the only alert path for dependencies: .npmrc has audit=false, so `npm ci` never
# warns. One grouped npm PR a week, and one for the GitHub Actions the workflow pins.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      npm:
        patterns:
          - '*'
    commit-message:
      prefix: chore(deps)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore(ci)
